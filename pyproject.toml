[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coldopen"
version = "0.1.0"
description = "AI agent that turns a long YouTube video or podcast into a captioned, podcast-style cold-open trailer (16:9 and 9:16)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "David Oluyale, Agentic AI Hub" }]
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40",
  "openai>=1.40",
  "pydantic>=2.6",
  "yt-dlp>=2024.10.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38"]
smartcrop = ["opencv-python-headless>=4.9,<5"]
dev = ["pytest>=8"]

[project.scripts]
coldopen = "coldopen.cli:main"

[tool.setuptools]
packages = ["coldopen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
